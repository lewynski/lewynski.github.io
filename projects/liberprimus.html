<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3301 // Liber Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg-color: #050605;
  --panel-bg: #0b0d0b;
  --panel-bg-2: #0f120f;
  --text-main: #c9d1c9;
  --text-dim: #6f7a6f;
  --cicada-green: #7fae5f;
  --cicada-glow: #9fd97a;
  --cicada-gold: #c8a94a;
  --cicada-red: #b6503f;
  --border-dark: #1a201a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Mono', monospace;
  background-color: var(--bg-color);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  flex-direction: column;
  background-image:
    radial-gradient(circle at 50% 0%, rgba(127,174,95,0.06), transparent 60%),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.25) 0px, rgba(0,0,0,0.25) 1px, transparent 1px, transparent 3px);
  overflow: hidden;
}
a, button, select, input, textarea { font-family: inherit; }
a, button, select { cursor: pointer; }
::selection { background: var(--cicada-green); color: #050605; }
#rain { position: fixed; inset: 0; z-index: 0; opacity: 0.16; pointer-events: none; }
.top-nav, .os-container { position: relative; z-index: 1; }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.message { animation: msgIn 0.35s ease both; }
@keyframes glyphPulse { 0%,100% { text-shadow: 0 0 6px rgba(200,169,74,0.4); } 50% { text-shadow: 0 0 16px rgba(200,169,74,0.9); } }
.nav-brand .glyph { display: inline-block; animation: glyphPulse 3s ease-in-out infinite; }
@keyframes flicker { 0%,19%,21%,55%,57%,100% { opacity: 1; } 20%,56% { opacity: 0.72; } }
.nav-brand { animation: flicker 6s infinite; }
.typing-indicator .dots::after { content: ''; animation: dots 1.4s steps(4,end) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
/* TOP NAV */
.top-nav { background: linear-gradient(180deg, #0d100d, #070807); border-bottom: 1px solid var(--border-dark); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; letter-spacing: 2px; }
.nav-brand { font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 700; color: var(--cicada-glow); text-shadow: 0 0 12px rgba(127,174,95,0.35); letter-spacing: 4px; }
.nav-brand .glyph { color: var(--cicada-gold); margin-right: 8px; }
.back-btn { background: transparent; color: var(--text-dim); padding: 8px 14px; text-decoration: none; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--border-dark); transition: all 0.15s; }
.back-btn:hover { color: var(--cicada-green); border-color: var(--cicada-green); }
/* LAYOUT */
.os-container { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 300px; background: rgba(0,0,0,0.35); border-right: 1px solid var(--border-dark); padding: 22px 18px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; }
.tool-panel { background: var(--panel-bg); border: 1px solid var(--border-dark); padding: 16px; }
.tool-panel h3 { font-size: 0.72rem; letter-spacing: 3px; text-transform: uppercase; color: var(--cicada-gold); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border-dark); font-weight: 600; }
.tool-panel h3 i { color: var(--cicada-green); margin-right: 6px; }
.tool-group { margin-bottom: 14px; }
.tool-group label { display: block; font-size: 0.62rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
select { width: 100%; padding: 9px; font-size: 0.85rem; background: var(--panel-bg-2); color: var(--text-main); border: 1px solid var(--border-dark); outline: none; letter-spacing: 1px; }
select:focus { border-color: var(--cicada-green); }
.quick-note { width: 100%; height: 110px; padding: 10px; font-size: 0.85rem; background: var(--panel-bg-2); color: var(--text-main); border: 1px solid var(--border-dark); resize: none; outline: none; line-height: 1.5; }
.quick-note:focus { border-color: var(--cicada-green); }
.btn-tool { width: 100%; background: transparent; color: var(--cicada-green); padding: 10px; font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--cicada-green); margin-top: 6px; transition: 0.15s; }
.btn-tool:hover { background: var(--cicada-green); color: #050605; box-shadow: 0 0 14px rgba(127,174,95,0.3); }
.btn-tool.danger { color: var(--cicada-red); border-color: var(--cicada-red); }
.btn-tool.danger:hover { background: var(--cicada-red); color: #050605; box-shadow: 0 0 14px rgba(182,80,63,0.3); }
/* CONVERSATION ARCHIVE LIST */
.convo-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; margin: 12px 0; }
.convo-list:empty::after { content: 'No archives yet.'; color: var(--text-dim); font-size: 0.7rem; letter-spacing: 1px; }
.convo-list::-webkit-scrollbar { width: 6px; }
.convo-list::-webkit-scrollbar-thumb { background: var(--border-dark); }
.convo-item { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--border-dark); background: var(--panel-bg-2); font-size: 0.8rem; transition: 0.15s; }
.convo-item:hover { border-color: var(--cicada-green); }
.convo-item.active { border-color: var(--cicada-green); box-shadow: inset 3px 0 0 var(--cicada-green); }
.convo-item .ctitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-main); cursor: pointer; }
.convo-item .cdel { background: none; border: none; color: var(--text-dim); font-size: 1rem; line-height: 1; padding: 0 2px; flex-shrink: 0; }
.convo-item .cdel:hover { color: var(--cicada-red); }
/* MAIN */
.main-terminal { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
.terminal-header { background: linear-gradient(180deg, #0d100d, #070807); padding: 14px 22px; border-bottom: 1px solid var(--border-dark); display: flex; justify-content: space-between; align-items: center; }
.terminal-header h2 { font-size: 0.78rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-main); font-weight: 600; }
.terminal-header h2 i { color: var(--cicada-green); margin-right: 8px; }
.status-wrap { display: flex; align-items: center; gap: 8px; font-size: 0.62rem; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
#modeLabel { color: var(--cicada-gold); }
.status-light { width: 9px; height: 9px; background: var(--cicada-green); border-radius: 50%; box-shadow: 0 0 10px var(--cicada-glow); animation: blink 2.4s infinite; }
.status-light.down { background: var(--cicada-red); box-shadow: 0 0 10px var(--cicada-red); animation: none; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
/* CHAT */
.chat-box { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.chat-box::-webkit-scrollbar { width: 8px; }
.chat-box::-webkit-scrollbar-track { background: var(--bg-color); }
.chat-box::-webkit-scrollbar-thumb { background: var(--border-dark); }
.chat-box::-webkit-scrollbar-thumb:hover { background: var(--cicada-green); }
.message { max-width: 80%; padding: 14px 16px; font-size: 0.92rem; line-height: 1.6; border: 1px solid var(--border-dark); position: relative; white-space: pre-wrap; word-wrap: break-word; }
.msg-capy { background: var(--panel-bg); color: var(--text-main); align-self: flex-start; border-left: 2px solid var(--cicada-green); }
.msg-capy::before { content: "3301"; display: block; font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 3px; color: var(--cicada-green); margin-bottom: 8px; }
.msg-user { background: var(--panel-bg-2); color: var(--text-main); align-self: flex-end; border-right: 2px solid var(--cicada-gold); }
.msg-user::before { content: "SEEKER"; display: block; font-size: 0.6rem; letter-spacing: 3px; color: var(--cicada-gold); margin-bottom: 8px; }
.msg-user .att-thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.msg-user .att-thumbs img { width: 60px; height: 60px; object-fit: cover; border: 1px solid var(--border-dark); }
.msg-user .att-file { font-size: 0.72rem; color: var(--cicada-gold); }
.msg-sys { align-self: center; max-width: 90%; text-align: center; font-size: 0.72rem; letter-spacing: 2px; color: var(--text-dim); border: 1px dashed var(--border-dark); background: transparent; text-transform: uppercase; }
.msg-sys::before { display: none; }
.msg-sys.err { color: var(--cicada-red); border-color: rgba(182,80,63,0.5); }
.typing-indicator { font-size: 0.72rem; letter-spacing: 2px; color: var(--cicada-green); align-self: flex-start; display: none; padding: 8px 12px; text-transform: uppercase; }
/* SUGGESTIONS */
.suggestions-container { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border-dark); }
.sugg-pill { background: transparent; border: 1px solid var(--border-dark); color: var(--text-dim); padding: 7px 12px; font-size: 0.78rem; letter-spacing: 1px; transition: 0.15s; }
.sugg-pill:hover { border-color: var(--cicada-green); color: var(--cicada-glow); }
/* ATTACHMENT TRAY */
.attach-tray { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 22px 0; }
.attach-tray:empty { display: none; }
.attach-chip { display: flex; align-items: center; gap: 8px; background: var(--panel-bg); border: 1px solid var(--border-dark); padding: 6px 8px; max-width: 230px; font-size: 0.76rem; }
.attach-chip img { width: 34px; height: 34px; object-fit: cover; border: 1px solid var(--border-dark); flex-shrink: 0; }
.attach-chip .fa-file-lines, .attach-chip .fa-file-pdf, .attach-chip .fa-file-code { color: var(--cicada-gold); font-size: 1.1rem; }
.attach-chip .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-main); }
.attach-chip .meta { color: var(--text-dim); font-size: 0.64rem; }
.attach-chip .rm { color: var(--cicada-red); background: none; border: none; font-size: 1rem; padding: 0 2px; line-height: 1; }
.attach-chip .rm:hover { color: #e06a55; }
.attach-chip.busy { opacity: 0.6; }
/* INPUT */
.input-area { display: flex; padding: 14px 22px 18px; background: linear-gradient(180deg, #070807, #0b0d0b); border-top: 1px solid var(--border-dark); gap: 10px; align-items: stretch; }
.input-wrapper { flex: 1; display: flex; }
.input-area textarea { width: 100%; height: 58px; padding: 14px; font-size: 0.95rem; background: var(--panel-bg-2); color: var(--text-main); border: 1px solid var(--border-dark); outline: none; resize: none; line-height: 1.4; }
.input-area textarea:focus { border-color: var(--cicada-green); box-shadow: 0 0 12px rgba(127,174,95,0.15); }
.action-btns { display: flex; gap: 8px; }
.btn-action { background: var(--panel-bg); color: var(--cicada-green); width: 54px; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; border: 1px solid var(--border-dark); transition: 0.15s; }
.btn-action:hover { border-color: var(--cicada-green); box-shadow: 0 0 12px rgba(127,174,95,0.25); }
.btn-action:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.btn-action.send { color: #050605; background: var(--cicada-green); }
.btn-action.send:hover { background: var(--cicada-glow); }
.btn-action.mic-active { background: var(--cicada-gold); color: #050605; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.disclaimer { text-align: center; font-size: 0.68rem; letter-spacing: 1px; color: var(--text-dim); padding: 7px; background: #030403; border-top: 1px solid var(--border-dark); }
@media (max-width: 900px) {
  body { height: auto; min-height: 100vh; overflow-y: auto; display: block; }
  .os-container { flex-direction: column; height: auto; overflow: visible; }
  .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-dark); }
  .main-terminal { height: 82vh; }
  .message { max-width: 95%; }
  .input-area { flex-direction: column; }
  .action-btns { flex-direction: row; width: 100%; }
  .btn-action { flex: 1; height: 48px; }
}
</style>

<body>
<canvas id="rain"></canvas>
<nav class="top-nav">
  <div class="nav-brand"><span class="glyph">&#8757;</span>3301 &middot; LIBER PRIMUS</div>

</nav>
<div class="os-container">
  <aside class="sidebar">
    <div class="tool-panel">
      <h3><i class="fas fa-key"></i> Cipher Prefs</h3>
      <div class="tool-group">

  <main class="main-terminal">

        <span id="modeLabel">Standard Guide</span>
        <span class="status-light" id="statusLight"></span>
        <span id="statusText">Link Active</span>
      </div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="typing-indicator" id="typingIndicator">3301 is decrypting<span class="dots"></span></div>
    <div class="suggestions-container">
      <button class="sugg-pill" onclick="insertPrompt('Explain how a JK flip-flop differs from a D flip-flop.')">Flip-flops</button>
      <button class="sugg-pill" onclick="insertPrompt('Debug this Python traceback for me:')">Debug code</button>
      <button class="sugg-pill" onclick="insertPrompt('Draft a formal follow-up email to an internship supervisor.')">Formal email</button>
      <button class="sugg-pill" onclick="insertPrompt('Give me a cryptic riddle whose answer is a prime number.')">A riddle</button>

      </div>
      <div class="action-btns">
        <input type="file" id="fileInput" multiple accept="image/*,.txt,.md,.csv,.json,.js,.py,.html,.css,.pdf" hidden>
        <button class="btn-action" id="attachBtn" title="Attach files"><i class="fas fa-paperclip"></i></button>
        <button class="btn-action" id="micBtn" title="Voice input"><i class="fas fa-microphone"></i></button>
        <button class="btn-action send" id="sendBtn" title="Send"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
    <div class="disclaimer">3301 relays through a server-side proxy. No key is stored in this page. Verify anything important.</div>
  </main>

<script>
/* ------------------------------------------------------------------
   3301 // Liber Terminal
   No API key lives in this file. Every model call goes through the
   Vercel serverless relay at /api/chat, which injects the system
   prompt server-side. The persona picker sends a KEY ('liber-code'),
   never prompt text -- the browser cannot rewrite the prompt.
   ------------------------------------------------------------------ */
const RELAY_URL = '/api/chat';
const MAX_IMG_MB = 3;
const MAX_TEXT_MB = 1;
const REQUEST_TIMEOUT_MS = 60000;
const PDF_PAGE_CAP = 30;

const STORE_KEY = 'cicada-conversations';
const LEGACY_KEY = 'cicada-chat-memory';
const NOTE_KEY = 'cicada-scratchpad';

const el = (id) => document.getElementById(id);
const chatBox = el('chatBox');
const userInput = el('userInput');
const sendBtn = el('sendBtn');
const micBtn = el('micBtn');
const attachBtn = el('attachBtn');
const fileInput = el('fileInput');
const attachTray = el('attachTray');
const typingIndicator = el('typingIndicator');
const personaSelect = el('persona-select');
const voiceSelect = el('voice-select');
const modeLabel = el('modeLabel');
const statusLight = el('statusLight');
const statusText = el('statusText');
const convoList = el('convoList');
const scratchpad = el('scratchpad');

/* Real entities. The version this page grew out of had a replace map
   where every character mapped back to itself -- a silent no-op. File
   names and conversation titles are written with innerHTML, so a file
   called `<img onerror=...>.txt` would have executed. */
function escapeHtml(str) {
  return String(str).replace(/[&<>"]/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
  });
}
/* ---------- conversation store ----------
   Shape: { conversations: [ { id, title, messages: [{role, content, attachments?}] } ], activeId }
   `content` may be a string or an OpenAI-style parts array (text + image_url). */
let store = { conversations: [], activeId: null };
let attachments = [];   // pending, cleared on send
let busy = false;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.conversations)) {
        store = { conversations: parsed.conversations, activeId: parsed.activeId || null };
      }
    }
  } catch (_) { /* corrupt payload -> start clean rather than throw on load */ }

  /* One-time migration from the single-thread build. */
  if (!store.conversations.length) {
    try {
      const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
      if (Array.isArray(legacy) && legacy.length) {
        store.conversations.push({ id: Date.now(), title: deriveTitle(legacy), messages: legacy });
      }
    } catch (_) { /* ignore */ }
  }

  if (!store.conversations.length) newConversation(true);
  if (!activeConvo()) store.activeId = store.conversations[0].id;
}

function persist() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  } catch (_) {
    /* Quota is realistic here: base64 images in history are large. */
    addSystem('Local archive is full. Older chats may not be saved.', true);
  }
}

function activeConvo() {
  return store.conversations.find(function (c) { return c.id === store.activeId; }) || null;
}
/* Plain text of a turn, whether it is a string or a parts array. */
function textOf(content) {
  if (typeof content === 'string') return content;
  if (!Array.isArray(content)) return '';
  return content
    .filter(function (p) { return p && p.type === 'text'; })
    .map(function (p) { return p.text; })
    .join(' ');
}

function deriveTitle(messages) {
  const first = (messages || []).find(function (m) { return m.role === 'user'; });
  const text = first ? textOf(first.content).trim().replace(/\s+/g, ' ') : '';
  if (!text) return 'Untitled transmission';
  return text.length > 34 ? text.slice(0, 34) + '...' : text;
}

function saveActive() {
  const c = activeConvo();
  if (c) c.title = deriveTitle(c.messages);
  persist();
  renderConvoList();
}

function newConversation(silent) {
  const convo = { id: Date.now() + Math.floor(Math.random() * 1000), title: 'New transmission', messages: [] };
  store.conversations.unshift(convo);
  store.activeId = convo.id;
  attachments = [];
  if (!silent) {
    persist();
    renderTray();
    renderHistory();
    renderConvoList();
  }
}

function switchConversation(id) {
  store.activeId = id;
  attachments = [];
  persist();
  renderTray();
  renderHistory();
  renderConvoList();
}
function deleteConversation(id) {
  store.conversations = store.conversations.filter(function (c) { return c.id !== id; });
  if (!store.conversations.length) newConversation(true);
  if (!activeConvo()) store.activeId = store.conversations[0].id;
  persist();
  renderHistory();
  renderConvoList();
}

function deleteAllConversations() {
  if (!confirm('Purge every archived transmission? This cannot be undone.')) return;
  store.conversations = [];
  newConversation(true);
  attachments = [];
  persist();
  renderTray();
  renderHistory();
  renderConvoList();
}

function renderConvoList() {
  convoList.innerHTML = '';
  store.conversations.forEach(function (c) {
    const row = document.createElement('div');
    row.className = 'convo-item' + (c.id === store.activeId ? ' active' : '');
    row.innerHTML =
      '<span class="ctitle" title="' + escapeHtml(c.title) + '">' + escapeHtml(c.title) + '</span>' +
      '<button class="cdel" title="Delete">&times;</button>';
    row.querySelector('.ctitle').addEventListener('click', function () { switchConversation(c.id); });
    row.querySelector('.cdel').addEventListener('click', function (e) {
      e.stopPropagation();
      deleteConversation(c.id);
    });
    convoList.appendChild(row);
  });
}
/* ---------- rendering ---------- */

/* Draw one bubble. `content` may be a string or a parts array; image parts
   become thumbnails, `files` lists non-image attachments by name. */
function drawBubble(role, content, files) {
  const div = document.createElement('div');
  div.className = 'message ' + (role === 'user' ? 'msg-user' : 'msg-capy');

  if (role === 'user') {
    const imgs = Array.isArray(content)
      ? content.filter(function (p) { return p && p.type === 'image_url'; })
      : [];
    if (imgs.length) {
      const wrap = document.createElement('div');
      wrap.className = 'att-thumbs';
      imgs.forEach(function (p) {
        const im = document.createElement('img');
        im.src = p.image_url.url;      // data: URL produced locally by FileReader
        im.alt = 'attached image';
        wrap.appendChild(im);
      });
      div.appendChild(wrap);
    }
    (files || []).forEach(function (name) {
      const f = document.createElement('div');
      f.className = 'att-file';
      f.textContent = 'attached: ' + name;
      div.appendChild(f);
    });
  }

  const body = document.createElement('span');
  body.textContent = textOf(content);   // textContent, never innerHTML: model output is untrusted
  div.appendChild(body);

  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function addSystem(text, isError) {
  const div = document.createElement('div');
  div.className = 'message msg-sys' + (isError ? ' err' : '');
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
/* Persist a turn onto the active conversation, then draw it. */
function addMessage(role, content, files) {
  const c = activeConvo();
  if (c) c.messages.push({ role: role, content: content, files: files || [] });
  drawBubble(role, content, files);
  saveActive();
}

function renderHistory() {
  chatBox.innerHTML = '';
  const c = activeConvo();
  if (!c || !c.messages.length) {
    drawBubble('assistant',
      'Link established. I am 3301.\n\nAsk anything, or drop a file, an image, or a PDF into this window and I will read it.');
    return;
  }
  c.messages.forEach(function (m) { drawBubble(m.role, m.content, m.files); });
}

function setLinkState(ok, label) {
  statusLight.classList.toggle('down', !ok);
  statusText.textContent = label || (ok ? 'Link Active' : 'Link Down');
}

/* ---------- text to speech ---------- */
function speak(text) {
  if (voiceSelect.value !== 'on' || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.slice(0, 600));
    u.rate = 1;
    u.pitch = 0.9;
    window.speechSynthesis.speak(u);
  } catch (_) { /* voice is a nicety; never let it break a reply */ }
}
/* ---------- attachments ---------- */
if (window.pdfjsLib) {
  /* Without a workerSrc pdf.js falls back to a main-thread build and throws
     on some versions; point it at the same CDN release as the library. */
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

/* Pull selectable text out of a PDF, capped so a 400-page scan cannot
   freeze the tab. Scanned PDFs have no text layer and will come back empty. */
async function extractPdf(file) {
  if (!window.pdfjsLib) throw new Error('PDF reader failed to load.');
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const pages = Math.min(pdf.numPages, PDF_PAGE_CAP);
  const out = [];
  for (let i = 1; i <= pages; i += 1) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    out.push(content.items.map(function (it) { return it.str; }).join(' '));
  }
  let text = out.join('\n\n').replace(/[ \t]+/g, ' ').trim();
  if (pdf.numPages > pages) {
    text += '\n\n[truncated: read ' + pages + ' of ' + pdf.numPages + ' pages]';
  }
  return text;
}
function renderTray() {
  attachTray.innerHTML = '';
  attachments.forEach(function (a, idx) {
    const chip = document.createElement('div');
    chip.className = 'attach-chip' + (a.pending ? ' busy' : '');
    const icon = a.kind === 'image'
      ? '<img src="' + a.dataUrl + '" alt="">'
      : '<i class="fas ' + (a.kind === 'pdf' ? 'fa-file-pdf' : 'fa-file-lines') + '"></i>';
    chip.innerHTML =
      icon +
      '<div><div class="fname">' + escapeHtml(a.name) + '</div>' +
      '<div class="meta">' + (a.pending ? 'reading...' : fmtSize(a.size)) + '</div></div>' +
      '<button class="rm" title="Remove">&times;</button>';
    chip.querySelector('.rm').addEventListener('click', function () {
      attachments.splice(idx, 1);
      renderTray();
    });
    attachTray.appendChild(chip);
  });
}

function readAsDataUrl(file) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function () { resolve(r.result); };
    r.onerror = function () { reject(new Error('Could not read ' + file.name)); };
    r.readAsDataURL(file);
  });
}

function readAsText(file) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function () { resolve(String(r.result)); };
    r.onerror = function () { reject(new Error('Could not read ' + file.name)); };
    r.readAsText(file);
  });
}
/* The relay caps images at 4 per request, so cap here too and say why. */
async function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  for (const file of files) {
    const isImage = /^image\//i.test(file.type);
    const isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);

    if (isImage) {
      const imgCount = attachments.filter(function (a) { return a.kind === 'image'; }).length;
      if (imgCount >= 4) { addSystem('Image limit reached: 4 per transmission.', true); continue; }
      if (file.size > MAX_IMG_MB * 1024 * 1024) {
        addSystem(escapeHtml(file.name) + ' is over ' + MAX_IMG_MB + ' MB and was skipped.', true);
        continue;
      }
      try {
        const dataUrl = await readAsDataUrl(file);
        attachments.push({ kind: 'image', name: file.name, size: file.size, dataUrl: dataUrl });
      } catch (err) { addSystem(err.message, true); }
      renderTray();
      continue;
    }

    if (file.size > MAX_TEXT_MB * 1024 * 1024) {
      addSystem(escapeHtml(file.name) + ' is over ' + MAX_TEXT_MB + ' MB and was skipped.', true);
      continue;
    }

    const entry = { kind: isPdf ? 'pdf' : 'text', name: file.name, size: file.size, text: '', pending: true };
    attachments.push(entry);
    renderTray();
    try {
      entry.text = isPdf ? await extractPdf(file) : await readAsText(file);
      if (!entry.text.trim()) {
        addSystem('No selectable text in ' + escapeHtml(file.name) + ' — it may be a scan.', true);
      }
    } catch (err) {
      addSystem(err.message || 'Could not read that file.', true);
      entry.text = '';
    }
    entry.pending = false;
    renderTray();
  }
}
/* ---------- send ---------- */

/* Some models emit a visible chain of thought in <think> tags. Strip it,
   including an unclosed tag, which happens when the reply is cut off. */
function stripThinking(text) {
  return text
    .replace(/<think>[\s\S]*?<\/think>/gi, '')
    .replace(/<think>[\s\S]*$/i, '')
    .trim();
}

/* Prior turns go up as text only. The relay caps a request at 4 images
   total across all messages, so replaying old screenshots would silently
   eat the budget for the image the user just attached. */
function payloadHistory(messages) {
  return messages.slice(-12).map(function (m) {
    return { role: m.role, content: textOf(m.content) };
  }).filter(function (m) { return m.content.trim(); });
}

function buildUserContent(text) {
  const images = attachments.filter(function (a) { return a.kind === 'image'; });
  const docs = attachments.filter(function (a) { return a.kind !== 'image' && a.text; });

  let body = text;
  docs.forEach(function (d) {
    body += '\n\n--- file: ' + d.name + ' ---\n' + d.text;
  });

  if (!images.length) return body;

  const parts = [{ type: 'text', text: body || 'Describe the attached image.' }];
  images.forEach(function (im) {
    parts.push({ type: 'image_url', image_url: { url: im.dataUrl } });
  });
  return parts;
}
async function handleSend() {
  if (busy) return;
  const text = userInput.value.trim();
  if (!text && !attachments.length) return;
  if (attachments.some(function (a) { return a.pending; })) {
    addSystem('Still reading an attachment. Try again in a moment.');
    return;
  }

  const convo = activeConvo();
  const history = payloadHistory(convo ? convo.messages : []);
  const content = buildUserContent(text);
  const fileNames = attachments
    .filter(function (a) { return a.kind !== 'image'; })
    .map(function (a) { return a.name; });
  const hasImages = Array.isArray(content);

  addMessage('user', content, fileNames);
  userInput.value = '';
  attachments = [];
  renderTray();

  busy = true;
  sendBtn.disabled = true;
  attachBtn.disabled = true;
  typingIndicator.style.display = 'block';

  const controller = new AbortController();
  const timer = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS);

  try {
    const res = await fetch(RELAY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: controller.signal,
      /* persona is a KEY. The relay looks the prompt up server-side and
         injects the system message itself, so this page must not send one --
         the relay drops client system turns anyway. */
      body: JSON.stringify({
        persona: 'liber-' + personaSelect.value,
        mode: hasImages ? 'vision' : 'text',
        messages: history.concat([{ role: 'user', content: content }])
      })
    });
    const data = await res.json().catch(function () { return null; });

    if (!res.ok) {
      if (res.status === 404) {
        throw new Error('The relay is not available on this host. GitHub Pages cannot run serverless functions — open the Vercel deployment.');
      }
      if (res.status === 401) throw new Error('The server rejected its API key. Check GROQ_API_KEY in Vercel.');
      if (res.status === 429) throw new Error('Rate limited upstream. Wait a moment and retry.');
      throw new Error((data && data.error) || ('Relay error ' + res.status + '.'));
    }

    /* THE BUG THIS PAGE WAS BUILT AROUND: it used to read only data.content.
       The relay returned only { reply }, so content was undefined -> ''
       -> the "(no answer returned)" fallback fired on every single call.
       The relay now sends both keys, and this reads either one. */
    let reply = stripThinking(String((data && (data.content || data.reply)) || ''));

    if (!reply) {
      addSystem('The model returned an empty response. Try rephrasing.', true);
    } else {
      addMessage('assistant', reply);
      speak(reply);
    }
    setLinkState(true);
  } catch (err) {
    const msg = err && err.name === 'AbortError'
      ? 'Request timed out after ' + (REQUEST_TIMEOUT_MS / 1000) + 's.'
      : (err && err.message) || 'Transmission failed.';
    addSystem(msg, true);
    setLinkState(false, 'Link Down');
  } finally {
    clearTimeout(timer);
    busy = false;
    sendBtn.disabled = false;
    attachBtn.disabled = false;
    typingIndicator.style.display = 'none';
  }
}
/* ---------- wiring ---------- */
window.insertPrompt = function (text) {
  userInput.value = text;
  userInput.focus();
};

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

attachBtn.addEventListener('click', function () { fileInput.click(); });
fileInput.addEventListener('change', function () {
  handleFiles(fileInput.files);
  fileInput.value = '';   // so re-picking the same file still fires change
});

/* Drag and drop anywhere on the page, and clipboard paste of images. */
['dragenter', 'dragover'].forEach(function (evt) {
  document.addEventListener(evt, function (e) { e.preventDefault(); });
});
document.addEventListener('drop', function (e) {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    handleFiles(e.dataTransfer.files);
  }
});
userInput.addEventListener('paste', function (e) {
  const items = e.clipboardData && e.clipboardData.files;
  if (items && items.length) { e.preventDefault(); handleFiles(items); }
});

el('btn-new-chat').addEventListener('click', function () { newConversation(false); });
el('btn-delete-all').addEventListener('click', deleteAllConversations);

personaSelect.addEventListener('change', function () {
  modeLabel.textContent = personaSelect.options[personaSelect.selectedIndex].text;
});

voiceSelect.addEventListener('change', function () {
  if (voiceSelect.value === 'off' && 'speechSynthesis' in window) window.speechSynthesis.cancel();
});
/* Scratchpad: local only, never sent anywhere. */
scratchpad.value = localStorage.getItem(NOTE_KEY) || '';
el('btn-save-note').addEventListener('click', function () {
  localStorage.setItem(NOTE_KEY, scratchpad.value);
  const btn = el('btn-save-note');
  btn.textContent = 'Committed';
  setTimeout(function () { btn.textContent = 'Commit to Local'; }, 1400);
});

/* ---------- speech recognition ---------- */
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = 'This browser has no speech recognition.';
    return;
  }
  const rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  let listening = false;

  rec.onresult = function (e) {
    const said = e.results[0][0].transcript;
    userInput.value = (userInput.value ? userInput.value + ' ' : '') + said;
  };
  rec.onerror = function (e) {
    addSystem('Microphone error: ' + (e.error || 'unknown') + '.', true);
  };
  rec.onend = function () {
    listening = false;
    micBtn.classList.remove('mic-active');
  };

  micBtn.addEventListener('click', function () {
    if (listening) { rec.stop(); return; }
    try {
      rec.start();
      listening = true;
      micBtn.classList.add('mic-active');
    } catch (_) { /* start() throws if already running */ }
  });
})();
/* ---------- glyph rain ---------- */
(function () {
  const canvas = el('rain');
  if (!canvas || !canvas.getContext) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    canvas.style.display = 'none';
    return;
  }

  const ctx = canvas.getContext('2d');
  const GLYPHS = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ0123456789∴';
  const SIZE = 16;
  let cols = 0;
  let drops = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.ceil(canvas.width / SIZE);
    drops = new Array(cols).fill(0).map(function () {
      return Math.random() * (canvas.height / SIZE);
    });
  }

  function frame() {
    /* Translucent wipe instead of clearRect: leaves the fading trail. */
    ctx.fillStyle = 'rgba(5, 6, 5, 0.09)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#7fae5f';
    ctx.font = SIZE + 'px "IBM Plex Mono", monospace';

    for (let i = 0; i < cols; i += 1) {
      const ch = GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
      ctx.fillText(ch, i * SIZE, drops[i] * SIZE);
      if (drops[i] * SIZE > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i] += 1;
    }
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
/* ---------- boot ---------- */
loadStore();
renderConvoList();
renderHistory();
renderTray();
modeLabel.textContent = personaSelect.options[personaSelect.selectedIndex].text;
setLinkState(true);
userInput.focus();
</script>
</body>
</html>
